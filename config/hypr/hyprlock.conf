# ==========================================================
# Hyprlock - Minimalist Studio Theme (Exact Rofi Layout)
# Typography: Geist / Palette: #f6f0ed / Text: #181920
# ==========================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/voil/.config/hypr/walls/67.png
    color = rgba(246, 240, 237, 1.0)
}

# 1. TIME (Clean Large Clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(24, 25, 32)
    font_size = 84
    font_family = Geist SemiBold
    position = 0, 170
    halign = center
    valign = center
}

# 2. DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgb(101, 105, 119)
    font_size = 15
    font_family = Geist Medium
    position = 0, 95
    halign = center
    valign = center
}

# 3. PASSWORD FIELD (Exact Screen Center, Centered Dots)
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0, 0, 0, 0.10)
    inner_color = rgb(246, 240, 237)
    font_color = rgb(24, 25, 32)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 14
    check_color = rgb(101, 105, 119)
    fail_color = rgb(200, 70, 70)
    fail_text = <i>Error</i>
    position = 0, 0
    halign = center
    valign = center
}

# 4. ROFI PROMPT ARROW (Left-aligned prompt)
label {
    monitor =
    text = >
    color = rgb(101, 105, 119)
    font_size = 14
    font_family = Geist SemiBold
    position = -120, 0
    halign = center
    valign = center
}
