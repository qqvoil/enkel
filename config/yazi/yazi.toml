[opener]
edit = [
	{ run = 'nvim %s', block = true, desc = "Neovim" },
]
image = [
	{ run = 'imv %s', orphan = true, desc = "imv" },
]
video = [
	{ run = 'mpv %s', orphan = true, desc = "mpv" },
]
audio = [
	{ run = 'mpv %s', block = true, desc = "mpv (CLI)" },
]
open = [
	{ run = 'xdg-open %s', orphan = true, desc = "Open" },
]

[open]
prepend_rules = [
	# Текст, конфиги, скрипты и код -> Neovim
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/x-ndjson", use = "edit" },
	{ mime = "application/{javascript,typescript,xml,toml,x-yaml,x-sh}", use = "edit" },
	{ url = "*.{json,toml,yaml,yml,conf,nix,lua,md,txt,sh,bash,zsh,rs,py,c,cpp,h,hpp,log,desktop}", use = "edit" },

	# Картинки -> imv (в фоне)
	{ mime = "image/*", use = "image" },

	# Видео -> mpv (в окне в фоне)
	{ mime = "video/*", use = "video" },

	# Аудио -> консольный mpv в терминале
	{ mime = "audio/*", use = "audio" },
	{ url = "*.{mp3,flac,wav,ogg,m4a,aac,opus,mid,midi}", use = "audio" },

	# Фолбэк для всего остального -> xdg-open
	{ url = "*", use = "open" },
]
